<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient - deep purple to vibrant blue -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    
    <!-- Glass highlight gradient -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Play button gradient -->
    <linearGradient id="playGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#4c1d95" flood-opacity="0.5"/>
    </filter>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#1e1b4b" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Glass overlay effect -->
  <rect x="32" y="32" width="448" height="224" rx="96" ry="96" fill="url(#glassHighlight)"/>
  
  <!-- Subtle grid pattern for texture -->
  <g opacity="0.05">
    <line x1="128" y1="32" x2="128" y2="480" stroke="#ffffff" stroke-width="1"/>
    <line x1="256" y1="32" x2="256" y2="480" stroke="#ffffff" stroke-width="1"/>
    <line x1="384" y1="32" x2="384" y2="480" stroke="#ffffff" stroke-width="1"/>
    <line x1="32" y1="128" x2="480" y2="128" stroke="#ffffff" stroke-width="1"/>
    <line x1="32" y1="256" x2="480" y2="256" stroke="#ffffff" stroke-width="1"/>
    <line x1="32" y1="384" x2="480" y2="384" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Film strip decoration - left -->
  <g opacity="0.15">
    <rect x="72" y="120" width="24" height="32" rx="4" fill="#ffffff"/>
    <rect x="72" y="168" width="24" height="32" rx="4" fill="#ffffff"/>
    <rect x="72" y="216" width="24" height="32" rx="4" fill="#ffffff"/>
    <rect x="72" y="264" width="24" height="32" rx="4" fill="#ffffff"/>
    <rect x="72" y="312" width="24" height="32" rx="4" fill="#ffffff"/>
    <rect x="72" y="360" width="24" height="32" rx="4" fill="#ffffff"/>
  </g>
  
  <!-- Film strip decoration - right -->
  <g opacity="0.15">
    <rect x="416" y="120" width="24" height="32" rx="4" fill="#ffffff"/>
    <rect x="416" y="168" width="24" height="32" rx="4" fill="#ffffff"/>
    <rect x="416" y="216" width="24" height="32" rx="4" fill="#ffffff"/>
    <rect x="416" y="264" width="24" height="32" rx="4" fill="#ffffff"/>
    <rect x="416" y="312" width="24" height="32" rx="4" fill="#ffffff"/>
    <rect x="416" y="360" width="24" height="32" rx="4" fill="#ffffff"/>
  </g>
  
  <!-- Main play button circle -->
  <circle cx="256" cy="256" r="120" fill="rgba(255,255,255,0.15)" filter="url(#innerShadow)"/>
  <circle cx="256" cy="256" r="100" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Play triangle with glow -->
  <g filter="url(#glow)">
    <polygon points="224,196 224,316 336,256" fill="url(#playGradient)"/>
  </g>
  
  <!-- Decorative streaming lines -->
  <g opacity="0.3">
    <path d="M140 420 Q 200 400, 256 420 Q 312 440, 372 420" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M160 444 Q 208 428, 256 444 Q 304 460, 352 444" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Small accent dots -->
  <circle cx="140" cy="140" r="8" fill="#ffffff" opacity="0.4"/>
  <circle cx="372" cy="140" r="6" fill="#ffffff" opacity="0.3"/>
  <circle cx="140" cy="372" r="6" fill="#ffffff" opacity="0.3"/>
  <circle cx="372" cy="372" r="8" fill="#ffffff" opacity="0.4"/>
  
  <!-- "F" letter watermark -->
  <text x="420" y="108" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" opacity="0.2">F</text>
</svg>
