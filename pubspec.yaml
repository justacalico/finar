name: finar
description: "A beautiful multi-platform Jellyfin client"
publish_to: 'none'
version: 1.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # Video playback
  media_kit: ^1.2.5
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # UI & Design
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  cupertino_icons: ^1.0.8

  # Networking & API
  dio: ^5.4.0
  http: ^1.2.0

  # State Management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Storage & Cache
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  path_provider: ^2.1.2
  path: ^1.9.0
  palette_generator: ^0.3.3+7
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.5
  connectivity_plus: ^7.0.0
  screen_brightness: ^2.1.7
  share_plus: ^10.1.4

  # Input
  gamepads: ^0.1.8+2
  dpad: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
