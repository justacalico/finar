version: '3.8'

services:
  finar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: finar:latest
    container_name: finar
    ports:
      - "8080:80"
    environment:
      # Optional: Set your Jellyfin server URL to enable proxy mode
      # This bypasses CORS issues by proxying API requests through nginx
      # Leave empty to connect directly (requires Jellyfin CORS configuration)
      - JELLYFIN_URL=${JELLYFIN_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

