build_release_linux:
  stage: build-linux
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  cache:
    key: "linux-deps-$CI_COMMIT_REF_SLUG-v2"
    paths:
      - .pub-cache/
    policy: pull-push
  before_script:
    # Install dependencies more efficiently
    - apt-get update -qq
    - apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libmpv-dev zip
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
  script:
    - flutter config --enable-linux-desktop
    - flutter pub get --no-precompile
    - dart run build_runner build --delete-conflicting-outputs
    # Extract version from pubspec.yaml or git tag
    - |
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        VERSION=${CI_COMMIT_TAG#v}
      else
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
      fi
      echo "Building Linux version $VERSION"
    - flutter build linux --release --build-name=$VERSION --build-number=$CI_PIPELINE_ID
    # Create zip archive of the bundle
    - cd build/linux/x64/release
    - zip -r $CI_PROJECT_DIR/doudou-$VERSION-linux-x64.zip bundle/
    - cd $CI_PROJECT_DIR
  artifacts:
    paths:
      - build/linux/x64/release/bundle/
      - doudou-*-linux-x64.zip
    expire_in: never
  timeout: 2h

build_linux_deb:
  stage: build-linux
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  cache:
    key: "linux-deb-deps-$CI_COMMIT_REF_SLUG-v1"
    paths:
      - .pub-cache/
    policy: pull-push
  before_script:
    # Install dependencies for Flutter Linux and DEB packaging
    - apt-get update -qq
    - apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libmpv-dev dpkg-dev
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies dist/ || true
    # Install fastforge globally using project's pub cache
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    - dart pub global activate fastforge
    - export PATH="$PATH:$PUB_CACHE/bin"
  script:
    - flutter config --enable-linux-desktop
    - flutter pub get --no-precompile
    - dart run build_runner build --delete-conflicting-outputs
    # Build DEB using fastforge
    - $CI_PROJECT_DIR/.pub-cache/bin/fastforge package --platform linux --targets deb
    # Move the output to a predictable location
    - mkdir -p artifacts
    - find dist -name "*.deb" -exec cp {} artifacts/klit-linux-amd64.deb \;
  artifacts:
    paths:
      - artifacts/klit-linux-amd64.deb
    expire_in: never
  timeout: 2h

build_linux_appimage:
  stage: build-linux
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
    # Allow AppImage tools to run without FUSE in Docker
    APPIMAGE_EXTRACT_AND_RUN: "1"
  cache:
    key: "linux-appimage-deps-$CI_COMMIT_REF_SLUG-v1"
    paths:
      - .pub-cache/
    policy: pull-push
  before_script:
    # Install dependencies for Flutter Linux and AppImage packaging
    - apt-get update -qq
    - apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libmpv-dev wget file squashfs-tools
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies dist/ || true
    # Install appimagetool - download and extract since FUSE is not available in Docker
    - wget -q -O /tmp/appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
    - chmod +x /tmp/appimagetool.AppImage
    # Extract appimagetool to run without FUSE
    - cd /tmp && ./appimagetool.AppImage --appimage-extract
    - mv /tmp/squashfs-root /opt/appimagetool
    - ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
    - cd $CI_PROJECT_DIR
    # Install fastforge globally using project's pub cache
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    - dart pub global activate fastforge
    - export PATH="$PATH:$PUB_CACHE/bin"
  script:
    - flutter config --enable-linux-desktop
    - flutter pub get --no-precompile
    - dart run build_runner build --delete-conflicting-outputs
    # Build AppImage using fastforge
    - $CI_PROJECT_DIR/.pub-cache/bin/fastforge package --platform linux --targets appimage
    # Move the output to a predictable location
    - mkdir -p artifacts
    - find dist -name "*.AppImage" -exec cp {} artifacts/klit-linux-x86_64.AppImage \;
  artifacts:
    paths:
      - artifacts/klit-linux-x86_64.AppImage
    expire_in: never
  timeout: 2h

build_web:
  stage: build-web
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
  cache:
    key: "web-deps-$CI_COMMIT_REF_SLUG-v1"
    paths:
      - .pub-cache/
    policy: pull-push
  before_script:
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
    - flutter --version
  script:
    - flutter pub get --no-precompile
    - dart run build_runner build --delete-conflicting-outputs
    # Extract version from pubspec.yaml or git tag
    - |
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        VERSION=${CI_COMMIT_TAG#v}
      else
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
      fi
      echo "Building Web version $VERSION"
    # Build web release (CanvasKit is the default renderer in Flutter 3.38+)
    - flutter build web --release --build-name=$VERSION --build-number=$CI_PIPELINE_ID
    # Create zip archive of the web build
    - cd build
    - zip -r $CI_PROJECT_DIR/finar-$VERSION-web.zip web/
    - cd $CI_PROJECT_DIR
  artifacts:
    paths:
      - build/web/
      - finar-*-web.zip
    expire_in: never
  timeout: 1h

# Build Docker image for web deployment
build_docker:
  stage: build-docker
  image: docker:latest
  services:
    - docker:dind
  tags:
    - linux
  allow_failure: true
  needs:
    - job: build_web
      artifacts: true
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # GitLab Container Registry
    CI_REGISTRY_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH
  before_script:
    - docker info
    # Login to GitLab Container Registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    # Extract version
    - |
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        VERSION=${CI_COMMIT_TAG#v}
      else
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
      fi
      echo "Building Docker image version $VERSION"
    # Build Docker image using pre-built web assets
    - |
      cat > Dockerfile.ci << 'EOF'
      FROM nginx:alpine
      RUN apk add --no-cache gettext
      COPY build/web /usr/share/nginx/html
      COPY docker/nginx.conf.template /etc/nginx/templates/default.conf.template
      COPY docker/docker-entrypoint.sh /docker-entrypoint.sh
      RUN chmod +x /docker-entrypoint.sh
      EXPOSE 80
      HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
        CMD wget --quiet --tries=1 --spider http://localhost/ || exit 1
      ENTRYPOINT ["/docker-entrypoint.sh"]
      CMD ["nginx", "-g", "daemon off;"]
      EOF
    - docker build -f Dockerfile.ci -t $CI_REGISTRY_IMAGE:$VERSION -t $CI_REGISTRY_IMAGE:latest .
    # Push to registry
    - docker push $CI_REGISTRY_IMAGE:$VERSION
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  timeout: 30m