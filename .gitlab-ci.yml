# Only run pipelines on main branch and tags to conserve compute minutes
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: never

stages:
  - build
  - build-linux
  - build-web
  - build-docker

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  ANDROID_KEYSTORE_PATH: "$CI_PROJECT_DIR/android/app/key.jks"
  GIT_STRATEGY: fetch
  GIT_DEPTH: 1
  GIT_CLEAN_FLAGS: -ffdx
  # Optimize artifact handling
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  FF_USE_FASTZIP: "true"

cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-v3"
  paths:
    - .pub-cache-$CI_JOB_NAME/
  policy: pull-push

# Build signed AAB for Google Play Store
build_release_aab:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  tags:
    - linux
  allow_failure: true
  # Only run when keystore variables are set
  rules:
    - if: $ANDROID_KEYSTORE_BASE64
      when: always
    - when: never
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 1
    FLUTTER_BUILD_MODE: "release"
    ANDROID_SDK_ROOT: "/opt/android-sdk-linux"
    ANDROID_HOME: "/opt/android-sdk-linux"
  cache:
    key: "apk-deps-$CI_COMMIT_REF_SLUG-v4"
    paths:
      - .pub-cache/
      - android/.gradle/
    policy: pull-push
  before_script:
    # Install Android SDK and tools
    - apt-get update -qq
    - apt-get install -y -qq wget unzip openjdk-17-jdk openjdk-17-jre-headless
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    # Setup Android SDK
    - mkdir -p $ANDROID_SDK_ROOT
    - cd $ANDROID_SDK_ROOT
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip -q commandlinetools-linux-9477386_latest.zip
    - mkdir -p cmdline-tools/latest
    - mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    # Accept licenses and install required components
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1
    - cd $CI_PROJECT_DIR
    # Flutter setup
    - flutter --version
    - flutter config --android-sdk $ANDROID_SDK_ROOT
    # Clean only what's necessary
    - rm -rf build/ .dart_tool/ .flutter-plugins-dependencies || true
    # Setup signing - decode base64 keystore from CI variable
    - |
      if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
        echo "Setting up release signing from CI variables..."
        mkdir -p android/app/keystore
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore/upload-keystore.jks
        # Create key.properties file in android/ directory (where build.gradle.kts expects it)
        # storeFile path is relative to android/app/ directory (where app's build.gradle.kts is)
        cat > android/key.properties << EOF
      storePassword=$ANDROID_KEYSTORE_PASSWORD
      keyPassword=$ANDROID_KEY_PASSWORD
      keyAlias=$ANDROID_KEY_ALIAS
      storeFile=keystore/upload-keystore.jks
      EOF
        echo "Release signing configured"
      else
        echo "Keystore not configured - this shouldn't happen with rules"
        exit 1
      fi
  script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/android/.gradle"
    - flutter pub get --no-precompile
    - dart run build_runner build --delete-conflicting-outputs
    # Extract version from pubspec.yaml or git tag
    - |
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
        # Use version from git tag (v8.0.0 -> 8.0.0)
        VERSION=${CI_COMMIT_TAG#v}
        echo "Building from tag: $VERSION"
      else
        # Extract version from pubspec.yaml
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
        echo "Building version from pubspec: $VERSION"
      fi
    # Generate build number from timestamp (last 7 digits to stay under Android's 2.1B limit)
    - BUILD_NUMBER=$(date +%s | cut -c4-10)
    - 'echo "Using version: $VERSION, build number: $BUILD_NUMBER"'
    # Build signed release AAB for Play Store
    - flutter build appbundle --release --build-name=$VERSION --build-number=$BUILD_NUMBER
  artifacts:
    paths:
      - build/app/outputs/bundle/release/app-release.aab
    expire_in: never
  timeout: 2h

